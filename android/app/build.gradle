plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brickstudio.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.brickstudio.app'
        minSdk 24
        targetSdk 34
        versionCode 23
        versionName '2.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
