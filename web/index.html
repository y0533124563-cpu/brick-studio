<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>סטודיו לבנים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap">
<style>
/* Layout: full-bleed 3D workbench, slim tool bar on top, part drawer at the bottom (phone first) */
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#17202B; --muted:#5B6776;
  --line:#D5DBE2; --accent:#F2B705; --accent-ink:#1E1A08; --danger:#C2341B;
  --scene:#DCE3EA; --base:#7FA98A;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#1A2029; --surface-2:#222A35; --ink:#E7ECF2; --muted:#9AA6B5;
  --line:#2E3845; --accent:#F5C21B; --accent-ink:#1E1A08; --danger:#F06A4F;
  --scene:#161C24; --base:#3E6B4B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --surface-2:#222A35; --ink:#E7ECF2; --muted:#9AA6B5;
  --line:#2E3845; --accent:#F5C21B; --accent-ink:#1E1A08; --danger:#F06A4F;
  --scene:#161C24; --base:#3E6B4B; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:19px;white-space:nowrap}
.brand-mark{width:26px;height:26px;flex:none}
.spacer{flex:1}
.pill{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ib{width:40px;height:40px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center}
.ib:hover{background:var(--surface-2)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}

/* stage */
#stage{position:relative;min-height:0;background:var(--scene);touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.rail{position:absolute;top:12px;right:calc(12px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.mode{width:48px;border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
.mode[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fabs{position:absolute;bottom:12px;left:calc(12px + env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center}
.fab{height:52px;min-width:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.fab.go{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:16px}
.confirm{position:absolute;top:50%;transform:translateY(-50%);left:calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;align-items:stretch}
.confirm button{border:1px solid var(--line);background:var(--surface);border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 12px;font-weight:700;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.16)}
.confirm .ok{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:16px;padding:16px 14px}
.confirm .ok svg{width:30px;height:30px;stroke-width:2.6}
.toast{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:.92}
.hint{position:absolute;top:12px;left:calc(12px + env(safe-area-inset-left,0px));max-width:min(230px,55%);font-size:12.5px;line-height:1.4;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:10px;padding:6px 10px}

/* drawer */
#sheet{background:var(--surface);border-top:1px solid var(--line);z-index:5}
.sheet-in{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:6px 10px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.handle{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px 4px;text-align:right;width:100%}
.handle .sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);flex:none}
.handle b{font-family:var(--f-display);font-weight:400;font-size:17px}
.handle small{color:var(--muted);font-size:13px}
.handle .chev{margin-inline-start:auto;transition:transform .2s}
#sheet.closed .chev{transform:rotate(180deg)}
#sheet.closed .drawer{display:none}
.drawer{display:flex;flex-direction:column;gap:8px;min-width:0}
.sheet-in>*{min-width:0}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:10px;padding:0 10px;height:40px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.parts .part{flex:none;width:78px;border:2px solid transparent;border-radius:12px;background:var(--surface-2);padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px}
.part img{width:62px;height:62px;display:block}
.part span{font-size:11.5px;line-height:1.15;color:var(--muted);text-align:center}
.part[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.part[aria-pressed="true"] span{color:var(--ink);font-weight:700}
.colors .c{flex:none;width:34px;height:34px;border-radius:9px;border:2px solid var(--line);position:relative}
.colors .c[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.colors .c.glass{background-image:linear-gradient(135deg,rgba(255,255,255,.7) 0 30%,transparent 30% 60%,rgba(255,255,255,.5) 60%)}
.empty{color:var(--muted);font-size:14px;padding:12px 4px;flex:none;max-width:320px;line-height:1.4}
.parts .part.ld{width:100px}
.part.ld span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;direction:ltr}
.part small{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}

/* panel */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:min(560px,100%);max-height:82%;overflow:auto;border-radius:18px 18px 0 0;
  padding-block:16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;display:flex;align-items:center;justify-content:space-between}
.panel h3{margin:6px 0 0;font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:700}
.field{display:flex;gap:8px}
.field input,textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;font:inherit;color:var(--ink)}
textarea{min-height:70px;resize:vertical;font-size:12px;direction:ltr;text-align:left}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.warn{background:var(--danger);color:#fff}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .grow div{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{color:var(--muted)}
.li .sw{width:18px;height:18px;border-radius:5px;border:1px solid var(--line);flex:none}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (min-width:900px){.parts .part{width:88px}.part img{width:70px;height:70px}}
</style>

</head>
<body>
<div id="app" dir="rtl">
  <header class="bar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="9" width="22" height="13" rx="2.5" fill="#F2B705"/><rect x="5" y="5" width="6" height="5" rx="1.5" fill="#F2B705"/><rect x="15" y="5" width="6" height="5" rx="1.5" fill="#F2B705"/><rect x="2" y="17" width="22" height="5" rx="2.5" fill="#000" opacity=".12"/></svg>
      סטודיו לבנים
    </div>
    <span class="pill" id="count">0 חלקים</span>
    <div class="spacer"></div>
    <button class="ib" id="undo" title="ביטול" aria-label="ביטול"><svg class="i" viewBox="0 0 24 24"><path d="M15 9h1.5a4.5 4.5 0 0 1 0 9H10"/><path d="M15 9H5"/><path d="M9 5L5 9l4 4"/></svg></button>
    <button class="ib" id="redo" title="חזרה" aria-label="חזרה"><svg class="i" viewBox="0 0 24 24"><path d="M9 9H7.5a4.5 4.5 0 0 0 0 9H14"/><path d="M9 9h10"/><path d="M15 5l4 4-4 4"/></svg></button>
    <button class="ib" id="bomBtn" title="רשימת חלקים" aria-label="רשימת חלקים"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></button>
    <button class="ib" id="saveBtn" title="הדגמים שלי" aria-label="הדגמים שלי"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
  </header>

  <main id="stage">
    <div class="hint" id="hint">גע במקום שבו תרצה לחבר את החלק. החיבורים יסומנו בלבן, ואז לחץ "אישור".</div>
    <div class="confirm" id="confirm" hidden>
      <button class="ok" id="okBtn" aria-label="אישור והנחת החלק"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>אישור</button>
      <button id="rotSel"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg><span id="rotLbl">סובב</span></button>
      <button id="nextHole" hidden><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M10 12h4"/></svg><span id="nextLbl">חור הבא</span></button>
      <button id="slideBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>הזז</button>
      <button id="flipBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>הפוך</button>
      <button id="cancelSel" aria-label="ביטול הסימון"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>ביטול</button>
    </div>
    <div class="rail" role="group" aria-label="מצב עבודה">
      <button class="mode" data-mode="build" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>בנייה</button>
      <button class="mode" data-mode="paint" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 20c2 0 4-1 4-3a2 2 0 0 0-4 0"/><path d="M8 17L19 6a2 2 0 0 0-3-3L5 14"/></svg>צביעה</button>
      <button class="mode" data-mode="erase" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>מחיקה</button>
    </div>
    <div class="fabs">
      <button class="fab" id="rotBtn" aria-label="סובב חלק"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>סובב</button>
    </div>
    <div class="toast" id="toast"></div>
  </main>

  <section id="sheet">
    <div class="sheet-in">
      <button class="handle" id="handle" aria-expanded="true">
        <span class="sw" id="curSw"></span>
        <span><b id="curName">לבנה 2×4</b> <small id="curColor">אדום</small></span>
        <svg class="i chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="drawer">
        <label class="search"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="חיפוש חלק, למשל: 2×4, גלגל, משופע" autocomplete="off"></label>
        <div class="row" id="tabs" role="group" aria-label="קטגוריות"></div>
        <div class="row parts" id="parts"></div>
        <div class="row colors" id="colors" role="group" aria-label="צבעים"></div>
      </div>
    </div>
  </section>
</div>

<div class="scrim" id="scrim" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/BufferGeometryUtils.js"></script>
<script>
(function(){
const PH=0.4, SR=0.3, SHt=0.17, BOUND=16, DARK='#2B3038';
const $=s=>document.querySelector(s);

/* ---------- colors ---------- */
const COLORS=[
 {n:'אדום',h:'#C91A09'},{n:'כחול',h:'#0055BF'},{n:'צהוב',h:'#F2CD37'},{n:'ירוק',h:'#237841'},
 {n:'ירוק בהיר',h:'#4B9F4A'},{n:'כתום',h:'#FE8A18'},{n:'לבן',h:'#F4F4F4'},{n:'אפור בהיר',h:'#A0A5A9'},
 {n:'אפור כהה',h:'#6C6E68'},{n:'שחור',h:'#1F2A33'},{n:'חום',h:'#583927'},{n:'בז׳',h:'#E4CD9E'},
 {n:'תכלת',h:'#5A93DB'},{n:'כחול כהה',h:'#0A3463'},{n:'אדום כהה',h:'#720E0F'},{n:'סגול',h:'#6B2C91'},
 {n:'ירוק כהה',h:'#184632'},{n:'זכוכית',h:'#AEE9EF',glass:true}];

/* ---------- geometry helpers ---------- */
function box(w,h,d,x,y,z){const g=new THREE.BoxGeometry(w,h,d);g.translate(x,y,z);return g}
let REC=null;
function cyl(r,h,x,y,z,axis,seg){if(REC&&r===SR&&h===SHt&&!axis)REC.push([x,y-SHt/2,z]);const g=new THREE.CylinderGeometry(r,r,h,seg||18);if(axis==='z')g.rotateX(Math.PI/2);if(axis==='x')g.rotateZ(Math.PI/2);g.translate(x,y,z);return g}
function studs(w,d,top){const a=[];for(let i=0;i<w;i++)for(let j=0;j<d;j++)a.push(cyl(SR,SHt,-w/2+i+.5,top+SHt/2,-d/2+j+.5));return a}
function merge(list){ // list of [geo, flag]
  const gs=list.map(([g])=>{const n=g.index?g.toNonIndexed():g; if(!n.attributes.uv){n.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(n.attributes.position.count*2),2))} return n});
  const m=THREE.BufferGeometryUtils.mergeBufferGeometries(gs,true);
  m.groups.forEach((gr,i)=>gr.materialIndex=list[i][1]);
  m.computeBoundingBox();return m}
const C=g=>[g,0], D=g=>[g,1];
/* connection points: rh = round hole (○), xh = cross hole (×), axle = cross stick (×), pin = round pin (○) */
const RH=(x,y,z,a)=>({t:'rh',p:[x,y,z],a}),XH=(x,y,z,a)=>({t:'xh',p:[x,y,z],a}),AXC=(x,y,z,a,len)=>({t:'axle',p:[x,y,z],a,len}),PNC=(x,y,z,a,len)=>({t:'pin',p:[x,y,z],a,len});
const xcross=(x,y,z,a,len)=>a==='z'?[D(box(.36,.12,len,x,y,z)),D(box(.12,.36,len,x,y,z))]:a==='x'?[D(box(len,.36,.12,x,y,z)),D(box(len,.12,.36,x,y,z))]:[D(box(.36,len,.12,x,y,z)),D(box(.12,len,.36,x,y,z))];

function mkBrick(w,d,hp,withStuds){const H=hp*PH;const l=[C(box(w-.04,H-.02,d-.04,0,H/2,0))];if(withStuds!==false)studs(w,d,H).forEach(s=>l.push(C(s)));return {list:l,w,d,h:hp}}
function mkSlope(w,d,hp){const H=hp*PH,s=new THREE.Shape();
  s.moveTo(-d/2+.02,0);s.lineTo(d/2-.02,0);s.lineTo(d/2-.02,H-.02);s.lineTo(d/2-1,H-.02);s.lineTo(-d/2+.02,.2);s.lineTo(-d/2+.02,0);
  const g=new THREE.ExtrudeGeometry(s,{depth:w-.04,bevelEnabled:false});g.rotateY(-Math.PI/2);g.translate(w/2-.02,0,0);
  const l=[C(g)];for(let i=0;i<w;i++)l.push(C(cyl(SR,SHt,-w/2+i+.5,H+SHt/2,d/2-.5)));return {list:l,w,d,h:hp}}
function mkTechBrick(n){const b=mkBrick(n,1,3);b.conns=[];const hole=x=>{b.list.push(D(cyl(.24,1.0,x,.58,0,'z')));b.conns.push(RH(x,.58,0,'z'))};if(n===1)hole(0);for(let i=1;i<n;i++)hole(-n/2+i);return b}
function mkLiftarm(n,xe){const l=[C(box(n-1,.94,.9,0,.6,0)),C(cyl(.47,.9,-(n-1)/2,.6,0,'z',22)),C(cyl(.47,.9,(n-1)/2,.6,0,'z',22))],conns=[];
  for(let i=0;i<n;i++){const x=-n/2+.5+i;if(xe&&(i===0||i===n-1)){l.push(...xcross(x,.6,0,'z',.94));conns.push(XH(x,.6,0,'z'))}else{l.push(D(cyl(.24,.94,x,.6,0,'z')));conns.push(RH(x,.6,0,'z'))}}
  return {list:l,w:n,d:1,h:3,conns}}
function mkAxle(n){return {list:[C(box(n-.04,.34,.12,0,.4,0)),C(box(n-.04,.12,.34,0,.4,0))],w:n,d:1,h:2,conns:[AXC(0,.4,0,'x',n)]}}
function mkGear(t){const R=t/16,s=new THREE.Shape(),k=t*2;for(let i=0;i<=k;i++){const a=i/k*Math.PI*2,r=(i%2)?R-.13:R;const x=Math.cos(a)*r,y=Math.sin(a)*r;i?s.lineTo(x,y):s.moveTo(x,y)}
  const g=new THREE.ExtrudeGeometry(s,{depth:.3,bevelEnabled:false});g.translate(0,R,-.15);
  const hp=Math.ceil(2*R/PH);return {list:[C(g),...xcross(0,R,0,'z',.34)],w:Math.max(1,Math.ceil(2*R)),d:1,h:hp,conns:[XH(0,R,0,'z')]}}

    ldFlat(file,new THREE.Matrix4().makeScale(.05,-.05,-.05),'16',pos,0); // 20 LDraw units = 1 stud; LDraw's Y points down
    if(!pos[0].length&&!pos[1].length){delete ldBuilt[id];throw new Error('empty part')}
    const g=new THREE.BufferGeometry(),all=pos[0].concat(pos[1]);g.setAttribute('position',new THREE.Float32BufferAttribute(all,3));
    g.addGroup(0,pos[0].length/3,0);g.addGroup(pos[0].length/3,pos[1].length/3,1);g.computeBoundingBox();
    const bb=g.boundingBox,x0=bb.min.x,x1=bb.max.x,y0=bb.min.y,y1=bb.max.y,z0=bb.min.z,z1=bb.max.z;
    const h=Math.max(1,Math.round((y1<=.25?-y0:y1-y0)/PH)); // most parts have their top surface at the origin
    const off=new THREE.Vector3(-(x0+x1)/2,-y0,-(z0+z1)/2);g.translate(off.x,off.y,off.z);g.computeVertexNormals();g.computeBoundingBox();
    let sn=[];try{const r=await fetch(LD_BASE+'snap/'+num.toLowerCase()+'.json');if(r.ok)sn=await r.json()}catch(e){}
    const snaps=sn.map(a=>{const secs=[];for(let i=0;i<a[3].length;i+=3)secs.push([a[3][i],a[3][i+1]]);
      return {g:a[0],caps:a[1],slide:!!a[2],secs,S:new THREE.Vector3(a[4]*.05,-a[5]*.05,-a[6]*.05).add(off),
        D:new THREE.Vector3(a[7],-a[8],-a[9]).normalize(),U:new THREE.Vector3(a[10],-a[11],-a[12]).normalize(),L:a[13]*.05}});
    GEO[id]={geo:g,w:Math.max(1,Math.round(x1-x0)),d:Math.max(1,Math.round(z1-z0)),h,conns:[],studs:[],snaps};if(!PMAP[id])ldReg(id)})();
  return ldBuilt[id]}

/* ---------- real connections: every stud, anti-stud, hole, axle and pin is a "snap" cylinder ----------
   LDraw parts use the LDCad Shadow Library data; built-in parts get theirs generated below. */
function perp(D){const a=Math.abs(D.y)>.9?new THREE.Vector3(1,0,0):new THREE.Vector3(0,1,0);return a.addScaledVector(D,-a.dot(D)).normalize()}
function bSnaps(id){const g=info(id),out=[],H=g.h*PH,V=THREE.Vector3,up=new V(0,1,0);
  const add=(gd,shape,L,S,D,caps,slide)=>out.push({g:gd,secs:[[shape,6]],L,S,D,U:perp(D),caps,slide});
  for(const [x,y,z] of g.studs)add('M','R',.2,new V(x,y,z),up,'one',false);
  if(!/^(la|lax|ax|pin|con|g\d|wheel)/.test(id))for(let i=0;i<g.w;i++)for(let j=0;j<g.d;j++)add('F','R',Math.min(H,1),new V(-g.w/2+i+.5,0,-g.d/2+j+.5),up,'one',false);
  for(const c of g.conns){const D=AXV[c.a].clone(),P=new V(...c.p);
    if(c.t==='rh'){const L=c.a==='y'?.4:1;add('F','R',L,P.clone().addScaledVector(D,-L/2),D,'none',true)}
    else if(c.t==='xh')add('F','A',1,P.clone().addScaledVector(D,-.5),D,'none',true);
    else if(c.t==='axle')add('M','A',c.len,P.clone().addScaledVector(D,-c.len/2),D,'none',true);
    else if(c.t==='pin')add('M','R',c.len,P.clone().addScaledVector(D,-c.len/2),D,'none',false)}
  return out}
function snapsFor(id){const g=info(id);if(!g.snaps)g.snaps=/^ld:/.test(id)?[]:bSnaps(id);return g.snaps}
const shp=x=>x==='A'?'A':x==='S'?'S':'R';
function compat(a,b){if(a.g===b.g)return false;const m=a.g==='M'?a:b,f=a.g==='M'?b:a;
  for(const [ms,mr] of m.secs)for(const [fs,fr] of f.secs){if(Math.abs(mr-fr)>.35)continue;const M=shp(ms),F=shp(fs);
    if(M==='A'&&(F==='A'||F==='R'))return true;if(M==='R'&&(F==='R'||F==='S'))return true;if(M==='S'&&F==='S')return true}
  return false}
function wSnaps(b){const m=meshes.get(b.id);if(!m)return[];m.updateMatrixWorld();const W=m.matrixWorld;
  return snapsFor(b.p).map(x=>({...x,S:x.S.clone().applyMatrix4(W),D:x.D.clone().transformDirection(W),U:x.U.clone().transformDirection(W)}))}
const baseSnap=(cx,cz)=>({g:'M',secs:[['R',6]],L:.2,S:new THREE.Vector3(cx+.5,0,cz+.5),D:new THREE.Vector3(0,1,0),U:new THREE.Vector3(1,0,0),caps:'one',slide:false,base:1});
function segDist(p,t){const v=p.clone().sub(t.S),k=Math.max(0,Math.min(t.L,v.dot(t.D)));return v.addScaledVector(t.D,-k).length()}
function snapXf(s){const h=snapsFor(S.part)[s.C[s.ci]],t=s.t,V=THREE.Vector3;
  const Dt=s.flip?t.D.clone().negate():t.D.clone(),Ut=t.U.clone().addScaledVector(Dt,-t.U.dot(Dt)).normalize().applyAxisAngle(Dt,s.rot*Math.PI/2);
  const Uh=h.U.clone().addScaledVector(h.D,-h.U.dot(h.D)).normalize();
  const Fh=new THREE.Matrix4().makeBasis(Uh,h.D,new V().crossVectors(Uh,h.D)),Ft=new THREE.Matrix4().makeBasis(Ut,Dt,new V().crossVectors(Ut,Dt));
  const q=new THREE.Quaternion().setFromRotationMatrix(Ft.multiply(Fh.transpose()));
  const anchor=s.flip?t.S.clone().addScaledVector(t.D,t.L):t.S.clone();
  return {q,pos:anchor.clone().addScaledVector(Dt,s.off).sub(h.S.clone().applyQuaternion(q)),anchor,Dt,h,t}}
function slideRange(s){const h=snapsFor(S.part)[s.C[s.ci]];if(!(h.slide&&s.t.slide))return [0,0];let lo=-h.L+.5,hi=s.t.L-.5;if(lo>hi)lo=hi=0;return [lo,hi]}
function defOff(s,hit){const [lo,hi]=slideRange(s);if(lo===hi)return lo;const x=snapXf({...s,off:0}),h=x.h;
  const proj=hit?hit.clone().sub(x.anchor).dot(x.Dt):(s.t.L-h.L)/2;return Math.max(lo,Math.min(hi,Math.round((proj-h.L/2)*2)/2))}
function snapTap(h){const H=snapsFor(S.part);if(!H.length)return false;let T;
  if(h.bid){const b=brickById(h.bid);if(!ready(b.p))return false;T=wSnaps(b)}else T=[baseSnap(h.cell.x,h.cell.z)];
  const cand=T.map(t=>({t,d:segDist(h.point,t)})).filter(o=>o.d<.75).sort((a,b)=>a.d-b.d);
  const g=info(S.part),ctr=new THREE.Vector3(0,g.h*PH/2,0);
  for(const o of cand){const C=H.map((x,k)=>k).filter(k=>compat(H[k],o.t));if(!C.length)continue;
    C.sort((a,b)=>H[a].S.distanceTo(ctr)-H[b].S.distanceTo(ctr));
    const sl={kind:'snap',bid:h.bid||null,t:o.t,T,C,ci:0,rot:0,flip:false,off:0};sl.off=defOff(sl,h.point);showSel(sl);
    const hs=H[C[0]],word=x=>({R:'○',A:'×',S:'□'}[shp(x.secs[0][0])]);toast(o.t.base||hs.secs[0][1]===6&&o.t.caps==='one'?'חיבור לבליטות':`חיבור ${hs.g==='M'?'זכר':'חור'} ${word(hs)} אל ${o.t.g==='M'?'זכר':'חור'} ${word(o.t)}`);return true}
  return false}
function engaged(s,x){ // which target connections line up once the part sits there (all get marked)
  const out=[];const W=new THREE.Matrix4().compose(x.pos,x.q,new THREE.Vector3(1,1,1));
  const held=snapsFor(S.part).map(h=>({...h,S:h.S.clone().applyMatrix4(W),D:h.D.clone().applyQuaternion(x.q)}));
  if(s.t.base){for(const h of held)if(h.g==='F'&&h.D.y>.95&&Math.abs(h.S.y)<.06){const cx=Math.floor(h.S.x),cz=Math.floor(h.S.z);
      if(Math.abs(h.S.x-cx-.5)<.08&&Math.abs(h.S.z-cz-.5)<.08&&cx>=-BOUND&&cx<BOUND&&cz>=-BOUND&&cz<BOUND)out.push(baseSnap(cx,cz))}return out.length?out:[s.t]}
  for(const t of s.T)if(t===s.t||held.some(h=>compat(h,t)&&Math.abs(h.D.dot(t.D))>.95&&(h.S.distanceTo(t.S)<.08||h.slide&&t.slide&&segDist(h.S,t)<.08)))out.push(t);
  return out}


/* ---------- panels ---------- */
const scrim=$('#scrim'),panel=$('#panel');
scrim.addEventListener('click',e=>{if(e.target===scrim)closePanel()});
function closePanel(){scrim.hidden=true;panel.innerHTML=''}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const closeBtn='<button class="ib" data-close aria-label="סגירה"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
function readModels(){try{return JSON.parse(localStorage.getItem('bs:models')||'{}')}catch(e){return {}}}
function writeModels(m){try{localStorage.setItem('bs:models',JSON.stringify(m));return true}catch(e){return false}}
function encode(){return btoa(unescape(encodeURIComponent(JSON.stringify(S.bricks.map(b=>b.f?[b.p,b.c,'f',b.px,b.py,b.pz,...b.q]:[b.p,b.c,b.x,b.y,b.z,b.r])))))}
function decode(t){const a=JSON.parse(decodeURIComponent(escape(atob(t.trim()))));return a.filter(r=>(PMAP[r[0]]||/^ld:/.test(r[0]))&&COLORS[r[1]]).map((r,i)=>r[2]==='f'?{id:i+1,p:r[0],c:r[1],f:1,px:r[3],py:r[4],pz:r[5],q:r.slice(6,10)}:{id:i+1,p:r[0],c:r[1],x:r[2],y:r[3],z:r[4],r:r[5]||0})}
function loadBricks(arr,msg){const prev=snap();S.bricks=arr;S.nextId=arr.reduce((a,b)=>Math.max(a,b.id),0)+1;commit(prev);hideSel();toast(msg)}

function openSave(){const ms=readModels(),names=Object.keys(ms).sort((a,b)=>ms[b].t-ms[a].t);
  panel.innerHTML=`<h2>הדגמים שלי ${closeBtn}</h2>
  <div class="field"><input id="mName" placeholder="שם הדגם, למשל: בית עם גג כחול" maxlength="40"><button class="btn" id="mSave">שמור</button></div>
  ${names.length?`<div class="list">${names.map(n=>`<div class="li"><div class="grow"><div>${esc(n)}</div><small>${ms[n].b.length} חלקים · ${new Date(ms[n].t).toLocaleDateString('he-IL')}</small></div><button class="btn ghost" data-open="${esc(n)}">פתח</button><button class="btn ghost" data-del="${esc(n)}">מחק</button></div>`).join('')}</div>`:'<p class="note">עדיין לא שמרת דגמים. תן שם לדגם ולחץ "שמור".</p>'}
  <h3>שיתוף עם חברים</h3>
  <p class="note">"העתק קוד" שומר את כל הדגם כטקסט. שלח אותו למישהו, והוא ידביק אותו כאן כדי לפתוח את הדגם אצלו.</p>
  <div class="field"><button class="btn ghost" id="mCopy">העתק קוד דגם</button><button class="btn ghost" id="mNew">משטח ריק</button></div>
  <textarea id="mCode" placeholder="הדבק כאן קוד דגם"></textarea>
  <div class="field"><button class="btn" id="mLoad">טען קוד</button></div>
  <p class="note">הדגמים נשמרים בדפדפן במכשיר הזה בלבד.</p>`;
  scrim.hidden=false;
  $('#mSave').onclick=()=>{const n=$('#mName').value.trim();if(!n){$('#mName').focus();toast('כתוב שם לדגם');return}const m=readModels();m[n]={t:Date.now(),b:S.bricks};if(writeModels(m)){toast('נשמר: '+n);openSave()}else toast('השמירה נכשלה, הדפדפן חוסם אחסון')};
  panel.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const m=readModels()[b.dataset.open];if(m){loadBricks(m.b,'נפתח: '+b.dataset.open);closePanel()}});
  panel.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(b.dataset.sure){const m=readModels();delete m[b.dataset.del];writeModels(m);openSave()}else{b.dataset.sure=1;b.textContent='בטוח?';b.className='btn warn'}});
  $('#mCopy').onclick=()=>{const code=encode(),ta=$('#mCode');ta.value=code;
    const fallback=()=>{ta.focus();ta.select();toast('הקוד מסומן, העתק אותו ידנית')};
    try{navigator.clipboard.writeText(code).then(()=>toast('הקוד הועתק'),fallback)}catch(e){fallback()}};
  $('#mNew').onclick=()=>{loadBricks([],'המשטח נוקה. אפשר לבטל עם החץ למעלה');closePanel()};
  $('#mLoad').onclick=()=>{try{const a=decode($('#mCode').value);loadBricks(a,'הדגם נטען ('+a.length+' חלקים)');closePanel()}catch(e){toast('הקוד לא תקין. בדוק שהעתקת את כולו')}}}
function openBom(){const g={};S.bricks.forEach(b=>{const k=b.p+'|'+b.c;g[k]=(g[k]||0)+1});const rows=Object.entries(g).sort((a,b)=>b[1]-a[1]);
  panel.innerHTML=`<h2>רשימת חלקים ${closeBtn}</h2>
  <p class="note">כל מה שצריך כדי לבנות את הדגם במציאות: <span class="num">${S.bricks.length}</span> חלקים, <span class="num">${rows.length}</span> סוגים.</p>
  ${rows.length?`<div class="list">${rows.map(([k,n])=>{const [p,c]=k.split('|');return `<div class="li"><span class="sw" style="background:${COLORS[c].h}"></span><div class="grow"><div>${PMAP[p].name}</div><small>${COLORS[c].n}</small></div><span class="num">×${n}</span></div>`}).join('')}</div>
  <div class="field"><button class="btn ghost" id="bCopy">העתק רשימה</button></div><textarea id="bTxt" hidden></textarea>`:'<p class="note">המשטח ריק. הוסף חלקים ותראה אותם כאן.</p>'}`;
  scrim.hidden=false;const bc=$('#bCopy');if(bc)bc.onclick=()=>{const txt=rows.map(([k,n])=>{const [p,c]=k.split('|');return `${n} × ${PMAP[p].name} (${COLORS[c].n})`}).join('\n');const ta=$('#bTxt');ta.value=txt;
    const fb=()=>{ta.hidden=false;ta.focus();ta.select();toast('הרשימה מסומנת, העתק אותה ידנית')};try{navigator.clipboard.writeText(txt).then(()=>toast('הרשימה הועתקה'),fb)}catch(e){fb()}}}
panel.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closePanel()});
$('#saveBtn').onclick=openSave;$('#bomBtn').onclick=openBom;

/* ---------- sample model ---------- */
function sample(){S.bricks=[];HM=new Map();const add=(p,c,x,z,r=0)=>{const f=fp(p,r);let y=0;for(let i=0;i<f.w;i++)for(let j=0;j<f.d;j++)y=Math.max(y,HM.get((x+i)+','+(z+j))||0);
    S.bricks.push({id:S.nextId++,p,c,x,y,z,r});for(let i=0;i<f.w;i++)for(let j=0;j<f.d;j++)HM.set((x+i)+','+(z+j),y+info(p).h)};
  add('p8x8',4,-4,-3);
  for(let L=0;L<3;L++){const c=L===1?6:0;add('b1x6',c,-3,-2);add('b1x6',c,-3,1);add('b1x2',c,-3,-1,1);add('b1x2',c,2,-1,1)}
  [-3,-1,1].forEach(x=>{add('s45_2x2',13,x,-2,0);add('s45_2x2',13,x,0,2)});
  add('r1b',10,6,3);add('r1b',10,6,3);add('dome2',3,5,2);
  add('tb8',8,-6,6);add('g24',0,-5,6);add('la7',2,-2,6);add('wheel',7,3,6);add('wheel',7,6,6);add('arch4',11,-8,1,1);
  add('cone1',5,7,-4);add('r2b',12,4,-5);add('t2x4',2,-8,-7)}

/* ---------- start ---------- */
let saved=null;try{saved=localStorage.getItem('bs:current')}catch(e){}
if(saved&&saved!=='[]'){try{restore(saved)}catch(e){sample();refresh()}}else{sample();refresh()}
$('#q').placeholder=`חיפוש בין ${PARTS.length} חלקים, למשל: 2×4, גלגל, חלון`;renderParts();updateCur();setTimeout(makeThumbs,60);
})();
