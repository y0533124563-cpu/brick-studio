<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>סטודיו לבנים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap">
<style>
/* Layout: full-bleed 3D workbench, slim tool bar on top, part drawer at the bottom (phone first) */
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#17202B; --muted:#5B6776;
  --line:#D5DBE2; --accent:#F2B705; --accent-ink:#1E1A08; --danger:#C2341B;
  --scene:#DCE3EA; --base:#7FA98A;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#1A2029; --surface-2:#222A35; --ink:#E7ECF2; --muted:#9AA6B5;
  --line:#2E3845; --accent:#F5C21B; --accent-ink:#1E1A08; --danger:#F06A4F;
  --scene:#161C24; --base:#3E6B4B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --surface-2:#222A35; --ink:#E7ECF2; --muted:#9AA6B5;
  --line:#2E3845; --accent:#F5C21B; --accent-ink:#1E1A08; --danger:#F06A4F;
  --scene:#161C24; --base:#3E6B4B; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:19px;white-space:nowrap}
.brand-mark{width:26px;height:26px;flex:none}
.spacer{flex:1}
.pill{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ib{width:40px;height:40px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center}
.ib:hover{background:var(--surface-2)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}

/* stage */
#stage{position:relative;min-height:0;background:var(--scene);touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.rail{position:absolute;top:12px;right:calc(12px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.mode{width:48px;border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
.mode[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fabs{position:absolute;bottom:12px;left:calc(12px + env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center}
.fab{height:52px;min-width:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.fab.go{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:16px}
.confirm{position:absolute;top:50%;transform:translateY(-50%);left:calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;align-items:stretch}
.confirm button{border:1px solid var(--line);background:var(--surface);border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 12px;font-weight:700;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.16)}
.confirm .ok{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:16px;padding:16px 14px}
.confirm .ok svg{width:30px;height:30px;stroke-width:2.6}
.toast{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:.92}
.hint{position:absolute;top:12px;left:calc(12px + env(safe-area-inset-left,0px));max-width:min(230px,55%);font-size:12.5px;line-height:1.4;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:10px;padding:6px 10px}

/* drawer */
#sheet{background:var(--surface);border-top:1px solid var(--line);z-index:5}
.sheet-in{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:6px 10px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.handle{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px 4px;text-align:right;width:100%}
.handle .sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);flex:none}
.handle b{font-family:var(--f-display);font-weight:400;font-size:17px}
.handle small{color:var(--muted);font-size:13px}
.handle .chev{margin-inline-start:auto;transition:transform .2s}
#sheet.closed .chev{transform:rotate(180deg)}
#sheet.closed .drawer{display:none}
.drawer{display:flex;flex-direction:column;gap:8px;min-width:0}
.sheet-in>*{min-width:0}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:10px;padding:0 10px;height:40px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.parts .part{flex:none;width:78px;border:2px solid transparent;border-radius:12px;background:var(--surface-2);padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px}
.part img{width:62px;height:62px;display:block}
.part span{font-size:11.5px;line-height:1.15;color:var(--muted);text-align:center}
.part[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.part[aria-pressed="true"] span{color:var(--ink);font-weight:700}
.colors .c{flex:none;width:34px;height:34px;border-radius:9px;border:2px solid var(--line);position:relative}
.colors .c[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.colors .c.glass{background-image:linear-gradient(135deg,rgba(255,255,255,.7) 0 30%,transparent 30% 60%,rgba(255,255,255,.5) 60%)}
.empty{color:var(--muted);font-size:14px;padding:12px 4px;flex:none;max-width:320px;line-height:1.4}
.parts .part.ld{width:100px}
.part.ld span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;direction:ltr}
.part small{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}

/* panel */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:min(560px,100%);max-height:82%;overflow:auto;border-radius:18px 18px 0 0;
  padding-block:16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;display:flex;align-items:center;justify-content:space-between}
.panel h3{margin:6px 0 0;font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:700}
.field{display:flex;gap:8px}
.field input,textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;font:inherit;color:var(--ink)}
textarea{min-height:70px;resize:vertical;font-size:12px;direction:ltr;text-align:left}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.warn{background:var(--danger);color:#fff}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .grow div{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{color:var(--muted)}
.li .sw{width:18px;height:18px;border-radius:5px;border:1px solid var(--line);flex:none}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
/* projects home screen */
.home{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.home-top{display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.acct{display:flex;align-items:center;gap:8px;min-width:0;margin-inline-start:auto}
.acct img{width:32px;height:32px;border-radius:50%;flex:none;background:var(--surface-2)}
.acct span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.acct .note{font-weight:400;font-size:13px}
.home-body{flex:1;overflow:auto;padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home-body h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 14px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:1100px}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.proj .open{border:0;padding:0;background:var(--scene);display:block}
.proj .open img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.proj .meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.proj .meta b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .meta small{color:var(--muted);font-variant-numeric:tabular-nums}
.proj .acts{display:flex;gap:6px;margin-top:6px}
.mini{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.mini.warn{background:var(--danger);border-color:var(--danger);color:#fff}
.proj input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 8px;font:inherit;color:var(--ink)}
.home-foot{background:var(--surface);border-top:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn.big{width:100%;max-width:520px;display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto;padding:14px;font-size:17px;border-radius:14px}
.signin{max-width:420px;display:flex;flex-direction:column;gap:14px;padding-block:20px}
.signin p{margin:0;line-height:1.5;color:var(--muted)}
.gbtn{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.home-empty{color:var(--muted);line-height:1.5;grid-column:1/-1}
.brand{cursor:pointer;border:0;background:transparent;color:inherit;font:inherit;font-family:var(--f-display);font-size:19px;padding:0;min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38vw}
@media (max-width:480px){#saveBtn{display:none}}
.ib.play{color:var(--accent-ink);background:var(--accent)}
.ib.play:hover{background:var(--accent);filter:brightness(1.05)}
.pro-list{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.panel a.btn{text-decoration:none;text-align:center}
.pro-badge{font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 9px;vertical-align:middle}
.selbar,.instr{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(560px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;gap:6px;z-index:6}
.selrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.selrow .cnt{font-weight:700;margin-inline-end:auto;padding-inline:4px;font-variant-numeric:tabular-nums}
.sb{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;min-width:40px;height:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:13px}
.sb svg{width:20px;height:20px}
.sb.warn{color:var(--danger)}
.sb.go{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pad{display:grid;grid-template-columns:repeat(3,40px);gap:4px;direction:ltr}
.acts2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;flex:1;min-width:150px}
.pad .sb{min-width:0;padding:0}
.instr .parts-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.instr .ip{flex:none;display:flex;flex-direction:column;align-items:center;font-size:12px;gap:2px;color:var(--muted)}
.instr .ip img{width:56px;height:56px;border-radius:8px;background:var(--surface-2)}
.instr .ip b{color:var(--ink);font-variant-numeric:tabular-nums}
.cmore{flex:none;width:34px;height:34px;border-radius:9px;border:2px dashed var(--line);background:transparent;font-weight:700;font-size:18px;color:var(--muted)}
.allcol{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.allcol button{aspect-ratio:1;border-radius:9px;border:2px solid var(--line)}
.allcol button[aria-pressed="true"]{border-color:var(--ink)}
.ib.wide{width:auto;padding:0 12px;gap:6px;font-weight:700}
#app.simming #sheet,#app.simming .rail,#app.simming .fabs,#app.simming .hint,#app.simming #selbar,#app.simming #confirm,#app.simming .bar .ib:not(#playBtn){display:none!important}
#app.simming #playBtn{display:none}
.simbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.15);z-index:7}
.simchip{font-weight:700;padding:0 8px;color:var(--accent-ink);background:var(--accent);border-radius:9px;height:38px;display:inline-flex;align-items:center}
.remote{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 16px));z-index:7;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none}
.remote>*{pointer-events:auto}
.gp{position:relative;padding-top:30px;direction:ltr;user-select:none;-webkit-user-select:none}
.gp-body{position:relative;aspect-ratio:2.15/1;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:44% 44% 30% 30%/58% 58% 42% 42%;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.gb{position:absolute;border:1px solid var(--line);background:var(--surface-2);font-size:11px;font-weight:700;color:var(--muted);touch-action:none}
.trig{top:0;width:22%;height:30px;border-radius:12px 12px 4px 4px}.trig.l{left:9%}.trig.r{right:9%}
.bump{top:16px;width:26%;height:22px;border-radius:10px;z-index:-1;padding-top:0}.bump.l{left:4%}.bump.r{right:4%}
.bump{top:20px;height:18px;font-size:10px;z-index:1}
.stick{position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--bg) 0 55%,var(--line) 56% 60%,var(--bg) 61%);border:2px solid var(--line);touch-action:none}
.stick.ls{left:9%;top:12%}.stick.rs{left:56%;top:50%}
.stick .knob{position:absolute;left:20%;top:20%;width:60%;height:60%;margin:0;border-radius:50%;background:var(--ink);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 -4px 0 rgba(255,255,255,.12);transition:transform .06s}
.dpad{position:absolute;left:26%;top:50%;width:21%;aspect-ratio:1}
.dp{position:absolute;border:1px solid var(--line);background:var(--ink);touch-action:none;padding:0}
.dp.u,.dp.d{left:34%;width:32%;height:36%}.dp.u{top:0;border-radius:6px 6px 0 0}.dp.d{bottom:0;border-radius:0 0 6px 6px}
.dp.l,.dp.r{top:34%;height:32%;width:36%}.dp.l{left:0;border-radius:6px 0 0 6px}.dp.r{right:0;border-radius:0 6px 6px 0}
.dp.c{position:absolute;left:33%;top:33%;width:34%;height:34%;background:var(--ink)}
.face{position:absolute;right:8%;top:10%;width:24%;aspect-ratio:1}
.fb{position:absolute;width:36%;height:36%;border-radius:50%;border:1px solid var(--line);background:var(--ink);color:var(--surface);font-weight:800;font-size:15px;touch-action:none;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.fb.t{left:32%;top:0}.fb.b{left:32%;bottom:0}.fb.l{left:0;top:32%}.fb.r{right:0;top:32%}
.gb.down,.dp.down,.fb.down{background:var(--accent);color:var(--accent-ink)}
.gp-hint{position:absolute;left:50%;transform:translateX(-50%);top:14%;font-size:11px;color:var(--muted);direction:rtl;white-space:nowrap}
.remote.editing .has::after{content:"";position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.remote.editing .on{outline:3px solid var(--accent);outline-offset:2px}
.abox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;max-height:38vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18);direction:rtl}
.abox-head{display:flex;align-items:center;gap:8px}.abox-head b{margin-inline-end:auto}
.axsw{display:flex;gap:4px}.axsw button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:34px;height:30px;font-size:16px}.axsw button.on{background:var(--accent);color:var(--accent-ink);outline:none}
.tgts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.abox-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rnote{font-size:12px;color:var(--muted);line-height:1.4;margin:0}
.tgt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;align-items:flex-start;text-align:right;min-width:0}
.tgt span{font-weight:700}.tgt small{font-size:11px;color:var(--muted);direction:ltr;text-align:left;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;outline:none}
.mini.warn{color:var(--danger);border-color:var(--danger);background:transparent}
.inv{display:flex;align-items:center;gap:6px;font-size:13px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (min-width:900px){.parts .part{width:88px}.part img{width:70px;height:70px}}
</style>

</head>
<body>
<div id="app" dir="rtl">
  <header class="bar">
    <button class="brand" id="homeBtn" title="הפרויקטים שלי">

<script src="lib/BufferGeometryUtils.js"></script>
<script>
(function(){
const PH=0.4, SR=0.3, SHt=0.17, BOUND=16, DARK='#2B3038';
const $=s=>document.querySelector(s);

/* ---------- colors ---------- */
const COLORS=[
 {n:'אדום',h:'#C91A09'},{n:'כחול',h:'#0055BF'},{n:'צהוב',h:'#F2CD37'},{n:'ירוק',h:'#237841'},
 {n:'ירוק בהיר',h:'#4B9F4A'},{n:'כתום',h:'#FE8A18'},{n:'לבן',h:'#F4F4F4'},{n:'אפור בהיר',h:'#A0A5A9'},
 {n:'אפור כהה',h:'#6C6E68'},{n:'שחור',h:'#1F2A33'},{n:'חום',h:'#583927'},{n:'בז׳',h:'#E4CD9E'},
 {n:'תכלת',h:'#5A93DB'},{n:'כחול כהה',h:'#0A3463'},{n:'אדום כהה',h:'#720E0F'},{n:'סגול',h:'#6B2C91'},
 {n:'ירוק כהה',h:'#184632'},{n:'זכוכית',h:'#AEE9EF',glass:true}];

/* ---------- geometry helpers ---------- */
function box(w,h,d,x,y,z){const g=new THREE.BoxGeometry(w,h,d);g.translate(x,y,z);return g}
let REC=null;
function cyl(r,h,x,y,z,axis,seg){if(REC&&r===SR&&h===SHt&&!axis)REC.push([x,y-SHt/2,z]);const g=new THREE.CylinderGeometry(r,r,h,seg||18);if(axis==='z')g.rotateX(Math.PI/2);if(axis==='x')g.rotateZ(Math.PI/2);g.translate(x,y,z);return g}
function studs(w,d,top){const a=[];for(let i=0;i<w;i++)for(let j=0;j<d;j++)a.push(cyl(SR,SHt,-w/2+i+.5,top+SHt/2,-d/2+j+.5));return a}
function merge(list){ // list of [geo, flag]
  const gs=list.map(([g])=>{const n=g.index?g.toNonIndexed():g; if(!n.attributes.uv){n.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(n.attributes.position.count*2),2))} return n});
  const m=THREE.BufferGeometryUtils.mergeBufferGeometries(gs,true);
  m.groups.forEach((gr,i)=>gr.materialIndex=list[i][1]);
  m.computeBoundingBox();return m}
const C=g=>[g,0], D=g=>[g,1];
/* connection points: rh = round hole (○), xh = cross hole (×), axle = cross stick (×), pin = round pin (○) */
const RH=(x,y,z,a)=>({t:'rh',p:[x,y,z],a}),XH=(x,y,z,a)=>({t:'xh',p:[x,y,z],a}),AXC=(x,y,z,a,len)=>({t:'axle',p:[x,y,z],a,len}),PNC=(x,y,z,a,len)=>({t:'pin',p:[x,y,z],a,len});
const xcross=(x,y,z,a,len)=>a==='z'?[D(box(.36,.12,len,x,y,z)),D(box(.12,.36,len,x,y,z))]:a==='x'?[D(box(len,.36,.12,x,y,z)),D(box(len,.12,.36,x,y,z))]:[D(box(.36,len,.12,x,y,z)),D(box(.12,len,.36,x,y,z))];

function mkBrick(w,d,hp,withStuds){const H=hp*PH;const l=[C(box(w-.04,H-.02,d-.04,0,H/2,0))];if(withStuds!==false)studs(w,d,H).forEach(s=>l.push(C(s)));return {list:l,w,d,h:hp}}
function mkSlope(w,d,hp){const H=hp*PH,s=new THREE.Shape();
  s.moveTo(-d/2+.02,0);s.lineTo(d/2-.02,0);s.lineTo(d/2-.02,H-.02);s.lineTo(d/2-1,H-.02);s.lineTo(-d/2+.02,.2);s.lineTo(-d/2+.02,0);
  const g=new THREE.ExtrudeGeometry(s,{depth:w-.04,bevelEnabled:false});g.rotateY(-Math.PI/2);g.translate(w/2-.02,0,0);
  const l=[C(g)];for(let i=0;i<w;i++)l.push(C(cyl(SR,SHt,-w/2+i+.5,H+SHt/2,d/2-.5)));return {list:l,w,d,h:hp}}
function mkTechBrick(n){const b=mkBrick(n,1,3);b.conns=[];const hole=x=>{b.list.push(D(cyl(.24,1.0,x,.58,0,'z')));b.conns.push(RH(x,.58,0,'z'))};if(n===1)hole(0);for(let i=1;i<n;i++)hole(-n/2+i);return b}
function mkLiftarm(n,xe){const l=[C(box(n-1,.94,.9,0,.6,0)),C(cyl(.47,.9,-(n-1)/2,.6,0,'z',22)),C(cyl(.47,.9,(n-1)/2,.6,0,'z',22))],conns=[];
  for(let i=0;i<n;i++){const x=-n/2+.5+i;if(xe&&(i===0||i===n-1)){l.push(...xcross(x,.6,0,'z',.94));conns.push(XH(x,.6,0,'z'))}else{l.push(D(cyl(.24,.94,x,.6,0,'z')));conns.push(RH(x,.6,0,'z'))}}
  return {list:l,w:n,d:1,h:3,conns}}
function mkAxle(n){return {list:[C(box(n-.04,.34,.12,0,.4,0)),C(box(n-.04,.12,.34,0,.4,0))],w:n,d:1,h:2,conns:[AXC(0,.4,0,'x',n)]}}
function mkGear(t){const R=t/16,s=new THREE.Shape(),k=t*2;for(let i=0;i<=k;i++){const a=i/k*Math.PI*2,r=(i%2)?R-.13:R;const x=Math.cos(a)*r,y=Math.sin(a)*r;i?s.lineTo(x,y):s.moveTo(x,y)}
  const g=new THREE.ExtrudeGeometry(s,{depth:.3,bevelEnabled:false});g.translate(0,R,-.15);
  const hp=Math.ceil(2*R/PH);return {list:[C(g),...xcross(0,R,0,'z',.34)],w:Math.max(1,Math.ceil(2*R)),d:1,h:hp,conns:[XH(0,R,0,'z')]}}
function mkWheel(R){R=R||1;const tr=R*.26,t=new THREE.TorusGeometry(R-tr,tr,12,30);t.translate(0,R,0);const w=Math.ceil(2*R);
  return {list:[D(t),C(cyl(R-tr*1.6,tr*1.7,0,R,0,'z',24)),...xcross(0,R,0,'z',tr*1.8)],w,d:1,h:Math.ceil(2*R/PH),conns:[XH(0,R,0,'z')]}}
function mkSlopeInv(w,d,hp){const H=hp*PH,s=new THREE.Shape();
  s.moveTo(-d/2+.02,H-.02);s.lineTo(d/2-.02,H-.02);s.lineTo(d/2-.02,0);s.lineTo(d/2-1,0);s.lineTo(-d/2+.02,H-.22);s.lineTo(-d/2+.02,H-.02);
  const g=new THREE.ExtrudeGeometry(s,{depth:w-.04,bevelEnabled:false});g.rotateY(-Math.PI/2);g.translate(w/2-.02,0,0);
  const l=[C(g)];studs(w,d,H).forEach(x=>l.push(C(x)));return {list:l,w,d,h:hp}}
function mkTechPlate(w,d){const b=mkBrick(w,d,1);b.conns=[];for(let i=1;i<w;i++)for(let j=1;j<d;j++){b.list.push(D(cyl(.22,.42,-w/2+i,.2,-d/2+j)));b.conns.push(RH(-w/2+i,.2,-d/2+j,'y'))}return b}
function mkPin(len){return {list:[D(cyl(.24,len-.06,0,.4,0,'x')),D(cyl(.29,.08,0,.4,0,'x'))],w:len,d:1,h:2,conns:[PNC(0,.4,0,'x',len)]}}
function mkConnector(n){return {list:[C(cyl(.3,n-.04,0,.4,0,'x')),D(box(n-.02,.2,.07,0,.4,0)),D(box(n-.02,.07,.2,0,.4,0))],w:n,d:1,h:2,conns:[XH(0,.4,0,'x')]}}
function frameShape(n,H,hx0,hx1,hy0,hy1){const s=new THREE.Shape();s.moveTo(-n/2+.02,0);s.lineTo(n/2-.02,0);s.lineTo(n/2-.02,H-.02);s.lineTo(-n/2+.02,H-.02);s.lineTo(-n/2+.02,0);
  const h=new THREE.Path();h.moveTo(hx0,hy0);h.lineTo(hx0,hy1);h.lineTo(hx1,hy1);h.lineTo(hx1,hy0);h.lineTo(hx0,hy0);s.holes.push(h);return s}
function mkWindow(n,hp){const H=hp*PH,f=.22,g=new THREE.ExtrudeGeometry(frameShape(n,H,-n/2+f,n/2-f,f,H-f),{depth:.96,bevelEnabled:false});g.translate(0,0,-.48);
  const l=[C(g),[box(n-2*f,H-2*f,.06,0,H/2,0),2]];if(n>=4)l.push(C(box(.12,H-2*f,.12,0,H/2,0)));studs(n,1,H).forEach(x=>l.push(C(x)));return {list:l,w:n,d:1,h:hp}}
function mkDoor(n,hp){const H=hp*PH,f=.2,g=new THREE.ExtrudeGeometry(frameShape(n,H,-n/2+f,n/2-f,.02,H-f),{depth:.96,bevelEnabled:false});g.translate(0,0,-.48);
  const l=[C(g),C(box(n-2*f-.04,H-f-.04,.12,0,(H-f)/2,0)),D(cyl(.08,.3,n/2-f-.35,H*.45,0,'z'))];studs(n,1,H).forEach(x=>l.push(C(x)));return {list:l,w:n,d:1,h:hp}}
function mkPanel(n,hp){const H=hp*PH;const l=[C(box(n-.04,.38,.96,0,.19,0)),C(box(n-.04,H-.4,.16,0,.4+(H-.4)/2,.4))];for(let i=0;i<n;i++)l.push(C(cyl(SR,SHt,-n/2+i+.5,H+SHt/2,.38,null,12)));return {list:l,w:n,d:1,h:hp}}
function mkFence(n){const H=6*PH;const l=[C(box(n-.04,.38,.96,0,.19,0)),C(box(n-.04,.14,.14,0,H-.15,0)),C(box(n-.04,.14,.14,0,.75,0))];for(let i=0;i<=n*2;i++)l.push(C(box(.12,H-.4,.12,-n/2+.06+i*(n-.12)/(n*2),.4+(H-.4)/2,0)));return {list:l,w:n,d:1,h:6}}
function mkRound(r,hp,withStuds,cone){const H=hp*PH;const g=cone?new THREE.CylinderGeometry(r>.6?.48:.29,r,H-.02,20):new THREE.CylinderGeometry(r,r,H-.02,24);g.translate(0,H/2,0);
  const w=Math.round(r*2),l=[C(g)];if(withStuds){if(w===1||cone)l.push(C(cyl(SR,SHt,0,H+SHt/2,0)));else studs(w,w,H).forEach(s=>l.push(C(s)))}return {list:l,w,d:w,h:hp}}
function mkDome(){const g=new THREE.SphereGeometry(.98,24,12,0,Math.PI*2,0,Math.PI/2);return {list:[C(g),C(cyl(SR,SHt,0,.98+SHt/2-.03,0))],w:2,d:2,h:3}}
function mkArch(n,hp,ry){const H=hp*PH,rx=n/2-1,s=new THREE.Shape();

S.sel=new Set();const r4=v=>Math.round(v*1e4)/1e4;
const selEdge=new THREE.LineBasicMaterial({color:0xF2B705,transparent:true,opacity:1,depthTest:false});
function drawSel(){for(const m of meshes.values()){const o=m.getObjectByName('selhl');if(o)m.remove(o)}
  for(const id of [...S.sel]){const m=meshes.get(id),b=brickById(id);if(!m||!b){S.sel.delete(id);continue}const l=new THREE.LineSegments(edgesFor(b.p),selEdge);l.name='selhl';l.renderOrder=30;m.add(l)}
  $('#selbar').hidden=!(S.mode==='select'&&S.sel.size);$('#selCount').textContent=S.sel.size===1?'חלק אחד נבחר':S.sel.size+' חלקים נבחרו'}
const selBricks=()=>S.bricks.filter(b=>S.sel.has(b.id));
function centerXZ(b){if(b.f)return {x:b.px,z:b.pz};const f=fp(b.p,b.r);return {x:b.x+f.w/2,z:b.z+f.d/2}}
function camAxes(){const fw=new THREE.Vector3();camera.getWorldDirection(fw);fw.y=0;if(fw.lengthSq()<1e-6)fw.set(0,0,-1);
  const ax=Math.abs(fw.x)>Math.abs(fw.z)?new THREE.Vector3(Math.sign(fw.x),0,0):new THREE.Vector3(0,0,Math.sign(fw.z));
  return {fw:ax,right:new THREE.Vector3().crossVectors(ax,new THREE.Vector3(0,1,0))}}
function moveSel(v,dy){const L=selBricks();if(!L.length)return;const prev=snap();
  for(const b of L){if(b.f){b.px=r4(b.px+v.x);b.pz=r4(b.pz+v.z);b.py=r4(b.py+dy*PH)}else{b.x+=Math.round(v.x);b.z+=Math.round(v.z);b.y=Math.max(0,b.y+dy)}}commit(prev)}
function rotSel(){const L=selBricks();if(!L.length)return;let sx=0,sz=0;for(const b of L){const c=centerXZ(b);sx+=c.x;sz+=c.z}
  const px=Math.round(sx/L.length),pz=Math.round(sz/L.length),q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI/2),prev=snap();
  for(const b of L){if(b.f){const rx=b.px-px,rz=b.pz-pz;b.px=r4(px+rz);b.pz=r4(pz-rx);const bq=new THREE.Quaternion(b.q[0],b.q[1],b.q[2],b.q[3]).premultiply(q);b.q=[bq.x,bq.y,bq.z,bq.w].map(r4)}
    else{const f=fp(b.p,b.r),cx=b.x+f.w/2,cz=b.z+f.d/2,nx=px+(cz-pz),nz=pz-(cx-px);b.r=(b.r+1)%4;const f2=fp(b.p,b.r);b.x=Math.round(nx-f2.w/2);b.z=Math.round(nz-f2.d/2)}}
  commit(prev);toast('סובב ב-90°')}
function dupSel(){const L=selBricks();if(!L.length)return;const {right}=camAxes();let lo=1e9,hi=-1e9;
  for(const b of L){const c=centerXZ(b),f=b.f?{w:1,d:1}:fp(b.p,b.r),half=Math.abs(right.x)?f.w/2:f.d/2,v=right.x?c.x*right.x:c.z*right.z;lo=Math.min(lo,v-half);hi=Math.max(hi,v+half)}
  const n=Math.ceil(hi-lo)+1,o=right.clone().multiplyScalar(n),prev=snap(),ids=new Set();
  for(const b of L){const nb=JSON.parse(JSON.stringify(b));nb.id=S.nextId++;if(nb.f){nb.px=r4(nb.px+o.x);nb.pz=r4(nb.pz+o.z)}else{nb.x+=o.x;nb.z+=o.z}S.bricks.push(nb);ids.add(nb.id)}
  S.sel=ids;commit(prev);toast('שוכפל. העותק בחור עכשיו, אפשר להזיז אותו')}
function connectedSel(){if(!S.sel.size){toast('בחר קודם חלק אחד');return}const {joints}=buildJoints(),adj=new Map();
  for(const j of joints){if(!adj.has(j.a))adj.set(j.a,[]);if(!adj.has(j.b))adj.set(j.b,[]);adj.get(j.a).push(j.b);adj.get(j.b).push(j.a)}
  const seen=new Set(S.sel),st=[...S.sel];while(st.length){const x=st.pop();for(const y of adj.get(x)||[])if(!seen.has(y)){seen.add(y);st.push(y)}}
  S.sel=seen;drawSel();toast('נבחרו כל החלקים שמחוברים')}
$('#selbar').addEventListener('click',e=>{const btn=e.target.closest('[data-sa]');if(!btn)return;const a=btn.dataset.sa,{fw,right}=camAxes();
  if(a==='f')moveSel(fw,0);else if(a==='b')moveSel(fw.clone().negate(),0);else if(a==='r')moveSel(right,0);else if(a==='l')moveSel(right.clone().negate(),0);
  else if(a==='u')moveSel(new THREE.Vector3(),1);else if(a==='d')moveSel(new THREE.Vector3(),-1);else if(a==='rot')rotSel();else if(a==='dup')dupSel();else if(a==='tiltA')tiltSel(right);else if(a==='tiltB')tiltSel(fw);
  else if(a==='paint'){const prev=snap();selBricks().forEach(b=>b.c=S.color);commit(prev);toast('נצבע ב'+COLORS[S.color].n)}
  else if(a==='del'){if(!btn.dataset.sure){btn.dataset.sure=1;btn.textContent='בטוח?';setTimeout(()=>{delete btn.dataset.sure;btn.innerHTML='<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>מחק'},2500);return}
    const prev=snap(),n=S.sel.size;S.bricks=S.bricks.filter(b=>!S.sel.has(b.id));S.sel.clear();commit(prev);toast(n+' חלקים נמחקו. אפשר לבטל עם החץ למעלה')}
  else if(a==='all'){S.sel=new Set(S.bricks.map(b=>b.id));drawSel()}else if(a==='none'){S.sel.clear();drawSel()}else if(a==='conn')connectedSel()});
document.addEventListener('keydown',e=>{if(S.mode!=='select'||!S.sel.size||e.target.matches('input,textarea'))return;const {fw,right}=camAxes(),k=e.key;
  const map={ArrowUp:()=>moveSel(fw,0),ArrowDown:()=>moveSel(fw.clone().negate(),0),ArrowRight:()=>moveSel(right,0),ArrowLeft:()=>moveSel(right.clone().negate(),0),PageUp:()=>moveSel(new THREE.Vector3(),1),PageDown:()=>moveSel(new THREE.Vector3(),-1),Delete:()=>$('[data-sa="del"]').click()};
  if(map[k]){e.preventDefault();map[k]()}});

/* ---------- official LDraw colours ---------- */
let LDCOL=[];
async function loadLDColors(){try{const r=await fetch(LD_BASE+'ldconfig.ldr');if(!r.ok)return;const t=await r.text(),list=[];
  for(const line of t.split(/\r?\n/)){const m=line.match(/^0\s+!COLOUR\s+(\S+)\s+CODE\s+(\d+)\s+VALUE\s+#([0-9A-Fa-f]{6})(.*)$/);if(!m)continue;const code=+m[2];if(code===16||code===24)continue;
    const rest=m[4],al=rest.match(/ALPHA\s+(\d+)/),c={n:m[1].replace(/_/g,' '),h:'#'+m[3],code};if(al&&+al[1]<255){c.glass=true;c.alpha=Math.max(.25,+al[1]/255)}
    if(/CHROME|METAL/.test(rest)){c.metal=.85;c.rough=.25}else if(/PEARLESCENT/.test(rest)){c.metal=.45;c.rough=.3}if(/RUBBER/.test(rest))c.rough=.9;
    COLORS['L'+code]=c;list.push('L'+code)}
  LDCOL=list;for(const k in MATS)if(k[0]==='L')delete MATS[k];for(const b of S.bricks)if(String(b.c)[0]==='L'){const m=meshes.get(b.id);if(m)m.material=[mat(b.c),darkMat,paneMat]}
  $('#moreCol').hidden=!list.length}catch(e){}}
function openColors(){const groups=[['רגילים',LDCOL.filter(k=>!COLORS[k].glass&&!COLORS[k].metal)],['שקופים',LDCOL.filter(k=>COLORS[k].glass)],['מתכתיים ופנינה',LDCOL.filter(k=>COLORS[k].metal)]];
  panel.innerHTML=`<h2>כל הצבעים ${closeBtn}</h2><p class="note">${LDCOL.length} הצבעים הרשמיים של ספריית LDraw.</p>`+groups.filter(g=>g[1].length).map(([n,ks])=>`<h3>${n}</h3><div class="allcol">${ks.map(k=>`<button data-col="${k}" title="${esc(COLORS[k].n)}" aria-label="${esc(COLORS[k].n)}" aria-pressed="${S.color===k}" style="background:${COLORS[k].h}"></button>`).join('')}</div>`).join('');
  scrim.hidden=false;panel.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{S.color=b.dataset.col;updateCur();closePanel();toast('צבע: '+COLORS[S.color].n)})}

/* ---------- building instructions (Pro) ---------- */
let INS=null;const insEdge=new THREE.LineBasicMaterial({color:0xF2B705,transparent:true,opacity:1,depthTest:false});
function openInstr(){if(!isPro()){openPro();return}if(SIM)stopSim();hideSel();if(!S.bricks.length){toast('הדגם ריק. הוסף חלקים כדי ליצור הוראות');return}
  const items=S.bricks.map((b,i)=>{const m=meshes.get(b.id);let y=0;if(m){const bb=new THREE.Box3().setFromObject(m);y=bb.min.y}return {b,i,layer:Math.round(y/PH+1e-3)}});
  items.sort((a,b)=>a.layer-b.layer||a.i-b.i);const steps=[];
  for(const it of items){const last=steps[steps.length-1];if(last&&last.layer===it.layer&&last.ids.length<4)last.ids.push(it.b.id);else steps.push({layer:it.layer,ids:[it.b.id]})}
  INS={steps,k:0};S.sel.clear();drawSel();$('#selbar').hidden=true;showStep()}
function showStep(){const {steps,k}=INS,shown=new Set(),cur=new Set(steps[k].ids);for(let i=0;i<=k;i++)steps[i].ids.forEach(id=>shown.add(id));
  for(const [id,m] of meshes){m.visible=shown.has(id);const o=m.getObjectByName('inshl');if(o)m.remove(o);if(cur.has(id)){const l=new THREE.LineSegments(edgesFor(brickById(id).p),insEdge);l.name='inshl';l.renderOrder=30;m.add(l)}}
  const cnt={};for(const id of steps[k].ids){const b=brickById(id),key=b.p+'|'+b.c;cnt[key]=(cnt[key]||0)+1}
  const el=$('#instr');el.hidden=false;
  el.innerHTML=`<div class="selrow"><span class="cnt">שלב ${k+1} מתוך ${steps.length}</span><button class="sb" data-ia="prev" ${k?'':'disabled'}>הקודם</button><button class="sb go" data-ia="next">${k<steps.length-1?'הבא':'סיום'}</button><button class="sb" data-ia="close" aria-label="סגור הוראות">✕</button></div>
    <div class="parts-row">${Object.entries(cnt).map(([key,n])=>{const [p,c]=key.split('|'),col=COLORS[c]||COLORS[0];return `<div class="ip"><img alt="" data-tid="${esc(p)}" src="${THUMBS[p]||BLANK}" style="box-shadow:inset 0 -6px 0 ${col.h}"><span><b>×${n}</b> ${esc(col.n)}</span></div>`}).join('')}</div>`;
  el.querySelectorAll('img[data-tid]').forEach(im=>{const p=im.dataset.tid;if(!THUMBS[p]&&ready(p)){setThumb(p);if(THUMBS[p])im.src=THUMBS[p]}})}
function closeInstr(){if(!INS)return;INS=null;for(const m of meshes.values()){m.visible=true;const o=m.getObjectByName('inshl');if(o)m.remove(o)}$('#instr').hidden=true;drawSel()}
$('#instr').addEventListener('click',e=>{const b=e.target.closest('[data-ia]');if(!b||!INS)return;const a=b.dataset.ia;
  if(a==='prev'&&INS.k>0){INS.k--;showStep()}else if(a==='next'){if(INS.k<INS.steps.length-1){INS.k++;showStep()}else{closeInstr();toast('סיימת את כל השלבים')}}else if(a==='close')closeInstr()});
$('#instrBtn').onclick=()=>INS?closeInstr():openInstr();

/* ---------- projects + Google account ----------
   Signed in: projects live in the user's Firebase account (users/{uid}/projects).
   Without Firebase settings (or in the preview) they are kept on this device. */
const FB=window.FIREBASE_CONFIG||null;let fbAuth=null,fbDb=null,USER=null,fbReady=false;

const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function listProjects(){if(USER){const q=await cloud().orderBy('updated','desc').get();return q.docs.map(d=>({id:d.id,...d.data()}))}
  return Object.values(local.read()).sort((a,b)=>b.updated-a.updated)}
async function putProject(id,rec){if(USER)await cloud().doc(id).set(rec);else{const o=local.read();o[id]={id,...rec};if(!local.write(o))throw new Error('storage full')}}

  const src=renderer.domElement,c=document.createElement('canvas');c.width=240;c.height=180;const sw=src.width,sh=src.height;let w=sw,h=sw*.75;if(h>sh){h=sh;w=sh/.75}
  c.getContext('2d').drawImage(src,(sw-w)/2,(sh-h)/2,w,h,0,0,240,180);ghost.visible=gv;hl.visible=hv;return c.toDataURL('image/jpeg',.72)}catch(e){return ''}}

  catch(e){toast(USER?'השמירה נכשלה. בדוק את החיבור לאינטרנט':'השמירה נכשלה, הזיכרון במכשיר מלא')}}
function openProject(p){if(SIMUI.on)exitSim();S.proj={id:p.id,name:p.name,saved:p.data||'[]'};try{S.ctrl=p.ctrl?JSON.parse(p.ctrl):{}}catch(e){S.ctrl={}}S.bricks=JSON.parse(p.data||'[]');S.nextId=S.bricks.reduce((a,b)=>Math.max(a,b.id),0)+1;
  S.undo=[];S.redo=[];hideSel();refresh();$('#projName').textContent=p.name;$('#home').hidden=true;setTimeout(resize,0)}
async function newProject(){const list=await listProjects().catch(()=>[]);const p={id:newId(),name:'פרויקט '+(list.length+1),data:'[]'};
  openProject(p);await saveNow();toast('פרויקט חדש נוצר. אפשר לשנות לו שם במסך הפרויקטים')}
async function goHome(){if(S.proj&&snap()!==S.proj.saved)await saveNow();$('#home').hidden=false;renderHome()}
async function signIn(){if(!fbAuth){toast('ההתחברות עם Google עוד לא הוגדרה');return}
  if(/; wv\)/.test(navigator.userAgent)){toast('באפליקציה ההתחברות עוד לא זמינה. התחבר באתר בדפדפן');return}
  const pr=new firebase.auth.GoogleAuthProvider();
  try{await fbAuth.signInWithPopup(pr)}catch(e){if(/popup-blocked|operation-not-supported/.test(e.code||''))await fbAuth.signInWithRedirect(pr);
    else if(!/popup-closed|cancelled-popup/.test(e.code||''))toast('ההתחברות נכשלה ('+(e.code||'שגיאה')+')')}}
async function uploadLocal(){const key='bs:up:'+USER.uid;try{if(localStorage.getItem(key))return}catch(e){return}
  const o=local.read(),ids=Object.keys(o);for(const id of ids){const {id:_,...rec}=o[id];await cloud().doc(id).set(rec,{merge:true})}
  try{localStorage.setItem(key,'1')}catch(e){}if(ids.length)toast(ids.length+' פרויקטים מהמכשיר הועלו לחשבון שלך')}
function card(p){const c=document.createElement('div');c.className='proj';
  c.innerHTML=`<button class="open" aria-label="פתח ${esc(p.name)}"><img alt="" src="${p.thumb||BLANK}"></button>
    <div class="meta"><b>${esc(p.name)}</b><small>${p.count||0} חלקים · ${new Date(p.updated||Date.now()).toLocaleDateString('he-IL')}</small>
    <div class="acts"><button class="mini" data-a="ren">שנה שם</button><button class="mini" data-a="del">מחק</button></div></div>`;
  c.querySelector('.open').onclick=()=>openProject(p);
  c.querySelector('[data-a="ren"]').onclick=()=>{const b=c.querySelector('b'),inp=document.createElement('input');inp.value=p.name;inp.maxLength=40;b.replaceWith(inp);inp.focus();inp.select();
    const done=async()=>{const n=inp.value.trim()||p.name;p.name=n;if(S.proj&&S.proj.id===p.id){S.proj.name=n;$('#projName').textContent=n}
      try{await patchProject(p.id,{name:n})}catch(e){toast('לא הצלחתי לשנות את השם')}renderHome()};
    inp.onkeydown=e=>{if(e.key==='Enter')inp.blur()};inp.onblur=done};
  const del=c.querySelector('[data-a="del"]');del.onclick=async()=>{if(!del.dataset.sure){del.dataset.sure=1;del.textContent='בטוח? מחק';del.classList.add('warn');return}
    try{await removeProject(p.id);if(S.proj&&S.proj.id===p.id)S.proj=null;toast('הפרויקט נמחק')}catch(e){toast('לא הצלחתי למחוק')}renderHome()};
  return c}
let homeGen=0;
async function renderHome(){const gen=++homeGen,acct=$('#acct'),grid=$('#projGrid'),nb=$('#newProj');
  if(FB&&!fbReady){acct.innerHTML='';grid.innerHTML='<div class="home-empty">טוען…</div>';nb.hidden=true;return}
  if(fbAuth&&!USER){acct.innerHTML='';nb.hidden=true;
    grid.innerHTML=`<div class="signin home-empty"><p>התחבר עם חשבון Google כדי לראות את הפרויקטים שלך, בכל מכשיר.</p>
      <button class="btn big gbtn" id="gIn"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1A10 10 0 0 0 2 12c0 1.6.4 3.1 1.1 4.6L6.4 14z"/><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.4 3-4.1 5.6-4.1z"/></svg>התחברות עם Google</button></div>`;
    $('#gIn').onclick=signIn;return}
  nb.hidden=false;
  acct.innerHTML=USER?`${USER.photoURL?`<img src="${esc(USER.photoURL)}" alt="" referrerpolicy="no-referrer">`:''}<span>${esc(USER.displayName||USER.email||'')}</span><button class="mini" id="gOut">התנתק</button>`
    :'<span class="note">נשמר במכשיר הזה</span>';
  const go=$('#gOut');if(go)go.onclick=async()=>{await fbAuth.signOut();S.proj=null};
  grid.innerHTML='<div class="home-empty">טוען פרויקטים…</div>';let list;
  try{list=await listProjects()}catch(e){if(gen===homeGen)grid.innerHTML='<div class="home-empty">לא הצלחתי לטעון את הפרויקטים. בדוק את החיבור לאינטרנט ונסה שוב.</div>';return}
  if(gen!==homeGen)return;grid.innerHTML='';
  if(!list.length){grid.innerHTML='<div class="home-empty">עוד אין לך פרויקטים. לחץ על "פרויקט חדש" למטה כדי להתחיל.</div>';return}
  list.forEach(p=>grid.appendChild(card(p)))}
$('#newProj').onclick=newProject;
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=rej;document.head.appendChild(el)})}
async function initFB(){if(!FB){fbReady=true;return}
  try{for(const x of ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'])await loadScript('lib/'+x);
    firebase.initializeApp(FB);fbAuth=firebase.auth();fbDb=firebase.firestore();fbAuth.getRedirectResult().catch(()=>{});
    fbAuth.onAuthStateChanged(async u=>{USER=u;fbReady=true;watchPro();if(u){try{await uploadLocal()}catch(e){}}if(!$('#home').hidden)renderHome();else if(!u){$('#home').hidden=false;renderHome()}})}
  catch(e){fbAuth=null;fbReady=true;renderHome()}}
function migrate(){try{if(localStorage.getItem('bs:migrated'))return false;localStorage.setItem('bs:migrated','1')}catch(e){return false}
  const o=local.read();let n=0;const cur=(()=>{try{return localStorage.getItem('bs:current')}catch(e){return null}})();
  if(cur&&cur!=='[]'){o[newId()]={name:'הדגם שלי',updated:Date.now(),count:JSON.parse(cur).length,thumb:'',data:cur};n++}
  try{const ms=JSON.parse(localStorage.getItem('bs:models')||'{}');for(const k in ms){o[newId()]={name:k,updated:ms[k].t,count:ms[k].b.length,thumb:'',data:JSON.stringify(ms[k].b)};n++}}catch(e){}
  local.write(o);return n>0||Object.keys(o).length>0}
ldReg('ld:3001');ldEnsure('ld:3001').catch(()=>{});
const hadAny=migrate();
if(!hadAny&&!Object.keys(local.read()).length&&!FB){ // first visit: a sample project to look at
  openProject({id:newId(),name:'בית לדוגמה',data:'[]'});$('#home').hidden=false;ldSample().then(()=>saveNow()).then(()=>renderHome())}
renderHome();initFB();loadLDColors();
$('#q').placeholder='חיפוש חלק: שם או מספר, למשל brick 2 x 4, 3001, גלגל';renderParts();updateCur();
})();
</script>
