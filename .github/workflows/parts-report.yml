name: Parts report

on:
  push:
    branches: [main]
    paths: [scripts/parts-report.py, scripts/snap-report.py, scripts/snap-detail.py, .github/workflows/parts-report.yml]
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ldraw-complete.zip
          key: ldraw-complete-v1
      - name: Build connection data
        run: |
          python3 scripts/get-ldraw.py ldraw-complete.zip > /dev/null
          git clone -q --depth 1 https://github.com/RolandMelkert/LDCadShadowLibrary shadow
          python3 scripts/build-snaps.py web/ldraw shadow > /dev/null
      - name: Cylinder details
        run: python3 scripts/snap-detail.py web/ldraw 2793c01-f1 61927-f1 2796c01 2793c03
