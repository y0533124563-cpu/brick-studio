name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Get 3D library
        run: bash scripts/get-libs.sh
      - name: Reuse downloaded LDraw library
        uses: actions/cache@v4
        with:
          path: ldraw-complete.zip
          key: ldraw-complete-v1
      - name: Get LDraw parts library
        run: python3 scripts/get-ldraw.py ldraw-complete.zip
      - name: Get connection data (LDCad Shadow Library)
        run: git clone --depth 1 https://github.com/RolandMelkert/LDCadShadowLibrary shadow
      - name: Build connection points for every part
        run: python3 scripts/build-snaps.py web/ldraw shadow
      - name: Library size
        run: |
          echo "::notice title=Library::$(du -sh web/ldraw | cut -f1) total, $(find web/ldraw/parts -maxdepth 1 -name '*.dat' | wc -l) part files, $(python3 -c "import json;print(len(json.load(open('web/ldraw/index.json'))))") in catalogue, $(ls web/ldraw/snap | wc -l) with connection data"
      - name: Connection report for key parts
        run: python3 scripts/snap-report.py web/ldraw 58120 99499 58121 99498 22169 22172 54675 74569 71427 3647 3648 3649 32270 32269 6589 3650c 4716 2851 2852 2853a 2853b 2854 2850a 3705 3706 32062 3713 32054 2780 6558 32524 3700 64179
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
