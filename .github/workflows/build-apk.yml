name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Get 3D library
        run: bash scripts/get-libs.sh
      - name: Copy website into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp -r web/* android/app/src/main/assets/
      - name: Build
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BrickStudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BrickStudio-apk
          path: BrickStudio.apk
      - name: Publish as download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: גרסה אחרונה
          body: קובץ ההתקנה העדכני של סטודיו לבנים. הורד את BrickStudio.apk והתקן בטלפון.
          files: BrickStudio.apk
          make_latest: true
